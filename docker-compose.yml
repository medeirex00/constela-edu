# Constela Edu — produção com um comando: docker compose up -d
#
# Topologia: PostgreSQL (dados) ← backend (FastAPI) ← web (nginx: SPA + proxy /api)
# Desktop e Mobile apontam para a MESMA API (http://servidor/api/v1).

# Rotação de logs em todos os serviços (evita disco cheio por json-file).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: constela
      POSTGRES_USER: constela
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U constela -d constela"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *logging
    environment:
      ENV: producao                # fail-closed: exige SECRET_KEY/DATABASE_URL
      DATABASE_URL: postgresql+psycopg://constela:${POSTGRES_PASSWORD}@postgres:5432/constela
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
      UPLOADS_DIR: /dados/uploads
      EXPORTS_DIR: /dados/exports
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      FORWARDED_ALLOW_IPS: "*"     # atrás do nginx: IP real vem do X-Forwarded-For
      AI_PROVIDER: ${AI_PROVIDER:-local}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      - dados_uploads:/dados/uploads
      - dados_exports:/dados/exports
    mem_limit: 768m                # teto de RAM (parser de PDF não derruba o host)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    logging: *logging
    # WEB_BIND=127.0.0.1 ao usar o perfil https (o Caddy alcança web:80 pela
    # rede interna; publicar em 0.0.0.0 exporia HTTP puro contornando o TLS e
    # o firewall — o Docker abre a porta ANTES do ufw).
    ports:
      - "${WEB_BIND:-0.0.0.0}:${PORTA_WEB:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

  # Backup automático diário: pg_dump + tar dos uploads, retenção de 14 dias.
  # Sobe com o perfil "backup": docker compose --profile backup up -d
  backup:
    image: postgres:17-alpine
    profiles: ["backup"]
    restart: unless-stopped
    logging: *logging
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dados_uploads:/dados/uploads:ro
      - ./backups:/backups
    # Backup seguro: grava em .part e só renomeia no SUCESSO (nunca deixa arquivo
    # vazio parecendo válido); a PODA de antigos só roda se o backup da vez deu
    # certo — uma falha JAMAIS apaga as cópias boas; falhas gritam no log.
    entrypoint: >
      sh -c 'while true; do
        ts=$$(date +%Y%m%d_%H%M%S); ok=1;
        if pg_dump -h postgres -U constela -d constela > /backups/db_$$ts.sql.part 2>>/backups/backup.log; then
          mv /backups/db_$$ts.sql.part /backups/db_$$ts.sql;
        else
          ok=0; rm -f /backups/db_$$ts.sql.part; echo "$$ts ERRO: pg_dump falhou" | tee -a /backups/backup.log;
        fi;
        if tar czf /backups/uploads_$$ts.tar.gz.part -C /dados uploads 2>>/backups/backup.log; then
          mv /backups/uploads_$$ts.tar.gz.part /backups/uploads_$$ts.tar.gz;
        else
          ok=0; rm -f /backups/uploads_$$ts.tar.gz.part; echo "$$ts ERRO: tar falhou" | tee -a /backups/backup.log;
        fi;
        if [ $$ok -eq 1 ]; then
          find /backups -name "db_*.sql" -type f -mtime +14 -delete;
          find /backups -name "uploads_*.tar.gz" -type f -mtime +14 -delete;
          echo "$$ts backup OK";
        else
          echo "$$ts backup FALHOU - poda adiada, copias antigas preservadas" | tee -a /backups/backup.log;
        fi;
        sleep 86400;
      done'
    depends_on:
      postgres:
        condition: service_healthy

  # HTTPS automático — só sobe com: docker compose --profile https up -d
  # Requer DOMINIO no .env apontando (DNS tipo A) para o IP do servidor.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO no .env para usar HTTPS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - dados_caddy:/data
    depends_on:
      - web

volumes:
  dados_postgres:
  dados_uploads:
  dados_exports:
  dados_caddy:
