<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" width="780" height="230"
     font-family="'Trebuchet MS','Segoe UI',system-ui,-apple-system,sans-serif">
  <title>Constela Edu — logo</title>

  <!-- Símbolo: estrela-marca + constelação -->
  <g transform="translate(20,44)">
    <!-- linhas da constelação (sutis) -->
    <g stroke="#5B6EE1" stroke-width="1.8" opacity="0.45" fill="none" stroke-linecap="round">
      <line x1="66" y1="66" x2="128" y2="14"/>
      <line x1="66" y1="66" x2="14" y2="120"/>
      <line x1="66" y1="66" x2="132" y2="120"/>
    </g>
    <!-- estrelinhas -->
    <circle cx="128" cy="14" r="5" fill="#5B6EE1"/>
    <circle cx="14" cy="120" r="3.6" fill="#8B9CF0"/>
    <circle cx="132" cy="120" r="3" fill="#8B9CF0"/>
    <!-- estrela principal (âmbar) -->
    <g transform="scale(2.75)">
      <path d="M24 2 L28.5 18 L45 20.5 L31.5 30 L36 46 L24 36.5 L12 46 L16.5 30 L3 20.5 L19.5 18 Z"
            fill="#F5B841"/>
      <circle cx="24" cy="24" r="3.4" fill="#1B2A4A"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="205" y="120" font-size="84" font-weight="800" letter-spacing="-1.5">
    <tspan fill="#1B2A4A">Constela</tspan><tspan fill="#F5B841"> Edu</tspan>
  </text>
  <text x="210" y="162" font-size="22.5" font-weight="600" letter-spacing="4.5" fill="#5B6EE1">
    GESTÃO E GAMIFICAÇÃO ESCOLAR
  </text>
</svg>
