# Lint do backend (ruff). Foco em BUGS reais (pyflakes/F, erros de sintaxe/E9),
# não em estilo — o código tem convenções próprias e deliberadas:
#   * nomes curtos (l, e, m) em laços/compreensões;
#   * imports após código em scripts/alembic/env (ajuste de sys.path);
#   * one-liners pontuais com ";".
line-length = 100
target-version = "py313"

[lint]
# Conjunto padrão do ruff (E4 imports, E7 statements, E9 sintaxe, F pyflakes).
select = ["E4", "E7", "E9", "F"]
ignore = [
  "E741", # "nome ambíguo" (l/I/O) — usado de propósito
  "E402", # import não-no-topo — intencional após sys.path em scripts/env
  "E702", # múltiplas instruções com ";" — one-liners legíveis
]

[lint.per-file-ignores]
"__init__.py" = ["F401", "F403"] # barris de re-export expõem símbolos
"tests/**" = ["F401", "F811", "F841"] # fixtures; variáveis criam registros no banco (efeito colateral)
"alembic/**" = ["F401"]          # env/migrações importam modelos p/ registrar
