# Configuração do Alembic — Constela Edu.
#
# IMPORTANTE: a URL do banco NÃO fica aqui. O env.py a lê de
# app.core.config.settings (mesma fonte da aplicação), então o mesmo comando
# funciona no SQLite de desenvolvimento e no PostgreSQL de produção sem
# duplicar configuração nem versionar segredos.

[alembic]
# Pasta com o env.py e as revisões (relativa a este arquivo).
script_location = alembic

# Garante que "app" seja importável quando o alembic roda a partir de backend/.
prepend_sys_path = .

# Nome dos arquivos de revisão: <rev>_<slug>. Sem timestamp para manter o
# histórico legível; a ordem real vem do encadeamento down_revision.
file_template = %%(rev)s_%%(slug)s

# Fuso usado em datas dentro das revisões (deixe em branco = horário local).
# timezone =

# sqlalchemy.url — deliberadamente ausente: definido em env.py via settings.


# --- Logging -----------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
