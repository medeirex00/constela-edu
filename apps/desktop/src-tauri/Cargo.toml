[package]
name = "sgpe-desktop"
version = "1.0.0"
description = "SGPE Desktop - Gestao e Premiacao Escolar"
authors = ["SGPE"]
edition = "2021"

[lib]
name = "sgpe_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
