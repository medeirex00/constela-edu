[package]
name = "constela-edu-desktop"
version = "1.0.0"
description = "Constela Edu Desktop - Gestao e Premiacao Escolar"
authors = ["Constela Edu"]
edition = "2021"

[lib]
name = "constela_edu_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
