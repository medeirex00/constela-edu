<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport correto elimina atraso de toque no iOS (PRD §9); viewport-fit
         cobre a tela toda e o CSS respeita as safe-areas (notch) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1B2A4A" />
    <meta
      name="description"
      content="Constela Edu — gestão e premiação escolar: notas configuráveis, rankings, evolução e painel público para escolas."
    />
    <!-- App instalável em tela cheia (Android e iPhone/Safari) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Constela Edu" />
    <title>Constela Edu — Gestão e Premiação Escolar</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
