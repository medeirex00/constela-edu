# Constela Edu — Web: SPA + proxy da API (mesma origem: sem CORS em produção)

# Rate limit do login: 5 req/min por IP real do cliente (frente a força bruta).
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Login infantil (Quest): defesa de BORDA contra enumeração por IP único de
# /quest/auth/* (colheita de perfis/nomes de crianças). Generoso para o NAT de
# UMA sala (~30 tablets logando na largada da aula, via burst); restritivo para
# um scraper de IP único. A defesa contra colheita DISTRIBUÍDA (muitos IPs) é do
# app/Redis (R3/A2, evolução futura). Número dimensionado p/ sala — ajustável.
limit_req_zone $binary_remote_addr zone=quest_login:10m rate=60r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Quando atrás do Caddy (perfil https), o IP real vem no X-Forwarded-For.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Compressão (o JS é o maior payload da SPA).
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Cabeçalhos de segurança. ATENÇÃO: no nginx o add_header do server só vale
    # para o location que NÃO tem nenhum add_header próprio (aqui, os da API).
    # Todo location com add_header que serve o HTML do SPA (/, /p/, /rede/p/)
    # precisa REPETIR os quatro — inclusive a CSP, com o mesmo valor. A catraca
    # estática (backend/tests/test_painel_publico_regressoes.py) confere isso
    # em todo location que serve o index.html. Os ativos (/assets/: JS, CSS,
    # imagens com hash) repetem só o nosniff — a CSP vale para o documento.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # img-src libera os tiles do mapa da Secretaria (OpenStreetMap) — imagens
    # públicas de mapa, sem cookies nem dados nossos na requisição.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Ativos com hash no nome podem ser cacheados para sempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header não é herdado do server: repete os de segurança aqui.
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Rate limit específico do login.
    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Login infantil do Quest (quem/entrar/entrar-qr): limite de borda por IP.
    # `^~` tem precedência sobre o `location /api/` genérico.
    location ^~ /api/v1/quest/auth/ {
        limit_req zone=quest_login burst=120 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API no backend (nome do serviço no docker-compose).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;  # regra da aplicação é 10 MB; folga p/ multipart
    }

    # Telão da escola (/p/…) e vitrine da rede (/rede/p/…): endereços SEM login
    # feitos para circular (QR para as famílias) e com nome de criança. Nenhum
    # buscador pode indexar nem arquivar (a cópia sobreviveria à troca do
    # token). Só nestas rotas: no SPA inteiro desindexaria o login e o resto.
    # add_header não é herdado: repete os de segurança do server (com a CSP,
    # que é o que mais importa na página com nome de criança). E `try_files
    # /index.html` serve o SPA AQUI mesmo — um fallback no último parâmetro
    # (`try_files $uri /index.html`) faria redirecionamento interno para o
    # `location /` e o X-Robots-Tag se perderia.
    location /p/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        try_files /index.html =404;
    }

    location /rede/p/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        try_files /index.html =404;
    }

    # SPA: o index.html sempre revalida (evita servir versão antiga após deploy).
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # add_header não é herdado do server: repete a CSP (o HTML do SPA é onde
        # ela protege — sem esta linha a instalação própria servia o SPA sem CSP).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
