# SGPE Web — SPA + proxy da API (mesma origem: sem CORS em produção)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ativos com hash no nome podem ser cacheados para sempre
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API no backend (nome do serviço no docker-compose)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;  # uploads de PDF das plataformas
    }

    # SPA: qualquer rota desconhecida cai no index.html
    location / {
        try_files $uri /index.html;
    }
}
