# Constela Edu — Web: SPA + proxy da API (mesma origem: sem CORS em produção)

# Rate limit do login: 5 req/min por IP real do cliente (frente a força bruta).
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Login infantil (Quest): defesa de BORDA contra enumeração por IP único de
# /quest/auth/* (colheita de perfis/nomes de crianças). Generoso para o NAT de
# UMA sala (~30 tablets logando na largada da aula, via burst); restritivo para
# um scraper de IP único. A defesa contra colheita DISTRIBUÍDA (muitos IPs) é do
# app/Redis (R3/A2, evolução futura). Número dimensionado p/ sala — ajustável.
limit_req_zone $binary_remote_addr zone=quest_login:10m rate=60r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Quando atrás do Caddy (perfil https), o IP real vem no X-Forwarded-For.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Compressão (o JS é o maior payload da SPA).
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Cabeçalhos de segurança (aplicados a todas as respostas).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Ativos com hash no nome podem ser cacheados para sempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header não é herdado do server: repete os de segurança aqui.
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Rate limit específico do login.
    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Login infantil do Quest (quem/entrar/entrar-qr): limite de borda por IP.
    # `^~` tem precedência sobre o `location /api/` genérico.
    location ^~ /api/v1/quest/auth/ {
        limit_req zone=quest_login burst=120 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API no backend (nome do serviço no docker-compose).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;  # regra da aplicação é 10 MB; folga p/ multipart
    }

    # SPA: o index.html sempre revalida (evita servir versão antiga após deploy).
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri /index.html;
    }
}
