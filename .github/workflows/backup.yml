# =============================================================================
# BRANCH DE RECUPERAÇÃO "recuperacao/senha-backups" — NÃO FAZER MERGE.
#
# Neste branch, este arquivo SUBSTITUI o backup diário por uma recuperação
# manual dos backups históricos. O backup diário do main continua intacto: o
# agendamento só roda no branch padrão. O arquivo tem o MESMO caminho do
# backup.yml do main porque o GitHub só dispara manualmente um workflow que
# exista no branch padrão; o disparo é feito com ref = recuperacao/senha-backups.
#
# modo = diagnostico : baixa UM backup DESTE repositório (padrão: o de 20/09,
#   artefato 10604370780) e tenta decifrá-lo com o secret BACKUP_PASSPHRASE.
#   Registra só "RESULTADO: OK | FALHOU | ERRO TÉCNICO". Não sobe artefato.
# modo = transferir  : (só depois de um diagnóstico OK) recifra os backups
#   aprovados do secret BACKUP_PASSPHRASE para o secret TEMPORÁRIO
#   BACKUP_PASSPHRASE_TRANSFERENCIA e sobe UM artefato de 3 dias, para o
#   repositório privado importar. Os artefatos originais NÃO são tocados.
# Nada aqui imprime senha ou conteúdo do banco. Nada é escrito no GitHub além
# do artefato de transferência (modo transferir).
# =============================================================================
name: Recuperação dos backups (branch de recuperação — não fazer merge)

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'diagnostico ou transferir'
        required: true
        type: choice
        options: [diagnostico, transferir]
      confirmacao:
        description: 'Digite DIAGNOSTICO ou TRANSFERIR (igual ao modo)'
        required: true
      artefato:
        description: 'Só no modo diagnostico: id do artefato (padrão: o de 20/09)'
        required: false
        default: '10604370780'
      ids:
        description: 'Só no modo transferir: ids aprovados, separados por vírgula'
        required: false
        default: '10604370780,10690878242,10746600820,11032708030,11415732920,11820675729'

permissions:
  contents: read
  actions: read    # baixar artefatos DESTE repositório com o token efêmero do job

concurrency:
  group: recuperacao-backups
  cancel-in-progress: false

jobs:
  # Disparo com modo e confirmação que não combinam termina VERMELHO (e não
  # "verde sem nada", que poderia ser lido como sucesso).
  conferir-entrada:
    if: "!((inputs.modo == 'diagnostico' && inputs.confirmacao == 'DIAGNOSTICO') || (inputs.modo == 'transferir' && inputs.confirmacao == 'TRANSFERIR'))"
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::modo e confirmação não combinam: nada foi executado."
          exit 1

  diagnostico:
    if: inputs.modo == 'diagnostico' && inputs.confirmacao == 'DIAGNOSTICO'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Diagnóstico — o secret abre o backup? (só OK / FALHOU / ERRO TÉCNICO)
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          ARTEFATO: ${{ inputs.artefato }}
        run: bash .github/recuperacao/diagnosticar_senha.sh "$ARTEFATO"

  transferir:
    if: inputs.modo == 'transferir' && inputs.confirmacao == 'TRANSFERIR'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Recifrar para a senha de transferência (originais intactos)
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_PASSPHRASE_TRANSFERENCIA: ${{ secrets.BACKUP_PASSPHRASE_TRANSFERENCIA }}
          IDS: ${{ inputs.ids }}
        run: bash .github/recuperacao/transferir_backups.sh "$IDS" ./transferencia
      - name: Guardar para o repositório privado importar (artefato de 3 dias)
        id: transferencia
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: transferencia-backups-${{ github.run_id }}
          path: transferencia/
          retention-days: 3
          if-no-files-found: error
      - name: Id do artefato de transferência (entrada da importação no repositório privado)
        env:
          ID_TRANSFERENCIA: ${{ steps.transferencia.outputs.artifact-id }}
        run: |
          echo "ID DO ARTEFATO DE TRANSFERÊNCIA: ${ID_TRANSFERENCIA}"
          echo "### Id do artefato de transferência: **${ID_TRANSFERENCIA}**" >> "$GITHUB_STEP_SUMMARY"
