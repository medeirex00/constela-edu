# =============================================================================
# Backup diário CIFRADO do Postgres de produção → artefato off-site (GitHub).
#
# DESLIGADO por padrão (fail-safe): só roda quando a variável de repositório
# BACKUP_ENABLED == 'true'. Assim o arquivo pode ser mesclado sem começar a
# tocar a produção antes de o dono configurar os segredos.
#
# Para ativar (uma vez), no GitHub → Settings:
#   • Variables → BACKUP_ENABLED = true
#   • Secrets → DATABASE_URL_RO   = string de conexão (idealmente read-only)
#   • Secrets → BACKUP_PASSPHRASE = senha forte que cifra o dump
#                                   (guarde-a num cofre, NÃO no repositório)
#
# Restauração e teste (“game day”): docs/DR-RUNBOOK.md
# =============================================================================
name: Backup do banco (produção)

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC ≈ 03:00 BRT (fora do horário escolar)
  workflow_dispatch: {}    # permite disparo manual para testar

permissions:
  contents: read

jobs:
  backup:
    if: vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Instalar postgresql-client 17 (mesma major do Supabase)
        # O runner do GitHub traz o client 16; o Supabase roda Postgres 17 e o
        # pg_dump exige client >= versão do servidor. Adiciona o repositório
        # oficial (PGDG) e instala o client 17.
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # O runner já tinha o client 16 no PATH. Coloca o 17 na FRENTE do PATH
          # para os passos seguintes (senão o pg_dump 16 é usado e dá mismatch).
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Gerar backup cifrado
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_RO }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: bash backend/scripts/backup_postgres.sh ./backups

      - name: Guardar off-site (artefato retido 30 dias)
        uses: actions/upload-artifact@v7
        with:
          name: backup-postgres-${{ github.run_id }}
          path: backups/*.enc
          retention-days: 30
          if-no-files-found: error

      - name: Sinal de vida (dead-man's-switch)
        # A cada backup BEM-SUCEDIDO, pinga um monitor externo (ex.: healthchecks.io,
        # grátis). Se o ping PARAR (backup falhou ou não rodou), o monitor avisa o
        # dono por e-mail — é o alarme de "nenhum backup nas últimas ~26h", que o
        # GitHub sozinho não dá. Sem o segredo configurado, o passo é ignorado.
        if: success()
        env:
          HEARTBEAT_URL: ${{ secrets.BACKUP_HEARTBEAT_URL }}
        run: |
          if [ -n "$HEARTBEAT_URL" ]; then
            curl -fsS -m 15 --retry 3 "$HEARTBEAT_URL" || true
          else
            echo "BACKUP_HEARTBEAT_URL não configurado — pulando o sinal de vida."
          fi

      - name: Avisar se o backup FALHOU
        # Em QUALQUER falha, notifica um webhook (Slack/Discord/genérico) se
        # configurado. Independente disso, o GitHub já envia e-mail ao dono quando
        # um workflow agendado falha (aviso padrão) — este passo é um reforço.
        if: failure()
        env:
          ALERT_WEBHOOK: ${{ secrets.BACKUP_ALERT_WEBHOOK }}
        run: |
          if [ -n "$ALERT_WEBHOOK" ]; then
            curl -fsS -m 15 -X POST -H 'Content-Type: application/json' \
              -d '{"text":"⚠️ Constela Edu: o BACKUP diario do banco FALHOU. Verifique o GitHub Actions."}' \
              "$ALERT_WEBHOOK" || true
          else
            echo "BACKUP_ALERT_WEBHOOK não configurado — pulando o aviso de falha."
          fi

      # OPCIONAL (recomendado ao escalar para rede municipal): enviar também
      # para um bucket S3/Backblaze com versionamento e Object Lock, em vez de
      # depender só do artefato do GitHub. Ver docs/DR-RUNBOOK.md §“Off-site”.
