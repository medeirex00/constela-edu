# CI do Constela Edu — roda em todo push na main e em todo Pull Request.
#
# Qualidade (bloqueante — "falha obrigatória em erro"): lint, testes com
# cobertura, build e E2E. Nenhum passo usa continue-on-error, então qualquer
# erro reprova o run (e, com branch protection, barra o merge).
# A varredura de segurança (pip-audit, npm audit, Trivy) vive em security.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela runs antigos do mesmo branch/PR quando um novo push chega.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar ruff
        run: pip install ruff==0.15.21
      - name: Ruff (backend)
        run: ruff check backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar workspaces
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Typecheck (core, quest-core, mobile)
        run: |
          npm run typecheck --workspace @constela/core
          npm run typecheck --workspace @constela/quest-core
          npm run typecheck --workspace @constela/mobile

  # O job acima para no ruff (erros preexistentes no backend) e aí o typecheck
  # nunca roda. Este job dá ao typecheck do core/quest-core/mobile e aos testes
  # do @constela/core um resultado próprio, sem afrouxar o ruff.
  typecheck:
    name: Typecheck (core, quest-core, mobile) + testes do core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar workspaces
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Typecheck (core, quest-core, mobile)
        run: |
          npm run typecheck --workspace @constela/core
          npm run typecheck --workspace @constela/quest-core
          npm run typecheck --workspace @constela/mobile
      - name: Testes do @constela/core (cliente HTTP compartilhado)
        run: npm run test --workspace @constela/core

  test-backend:
    name: Testes backend (pytest + cobertura)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependências
        run: pip install -r backend/requirements.txt
      - name: Pytest com cobertura
        working-directory: backend
        run: python -m pytest -q --cov=app --cov-report=xml --cov-report=term
      - name: Publicar cobertura (artefato)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage.xml
          retention-days: 7
      - name: Codecov (opcional — só se CODECOV_TOKEN estiver configurado)
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

  migracoes-postgres:
    name: Migrações Alembic (PostgreSQL real)
    runs-on: ubuntu-latest
    # Exercita o caminho REAL de produção: o entrypoint do container aplica as
    # migrações num PostgreSQL de verdade. O ramo `postgresql` da 0003 (DROP/ADD
    # CONSTRAINT nativo) nunca roda nos testes (SQLite) — aqui ele é exercido,
    # pegando incompatibilidades de dialeto ANTES do deploy.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: constela
          POSTGRES_PASSWORD: constela
          POSTGRES_DB: constela_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U constela"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Mesmo driver de produção (psycopg 3). No postgresql:// puro o SQLAlchemy
      # 2.0 tentaria o psycopg2 (ausente) — daí o sufixo +psycopg.
      DATABASE_URL: postgresql+psycopg://constela:constela@localhost:5432/constela_ci
      ENV: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependências (+ driver do Postgres, como no Dockerfile)
        run: pip install -r backend/requirements.txt "psycopg[binary]==3.2.3"
      - name: Aplicar migrações no PostgreSQL (entrypoint real do container)
        working-directory: backend
        run: python -m scripts.migrate
      - name: Rodar de novo — idempotência no PostgreSQL
        working-directory: backend
        run: python -m scripts.migrate
      - name: Conferir schema no head e tabelas-chave presentes
        working-directory: backend
        run: |
          python - <<'PY'
          from alembic.script import ScriptDirectory
          from sqlalchemy import inspect, text
          from app.core.database import engine
          from app.core.migracoes import _config
          head = ScriptDirectory.from_config(_config()).get_current_head()
          with engine.connect() as c:
              versao = c.execute(text("SELECT version_num FROM alembic_version")).scalar()
          assert versao == head, f"versao {versao} != head {head}"
          tabelas = set(inspect(engine).get_table_names())
          faltando = {"usuarios", "alunos", "notas", "quest_missoes",
                      "quest_tentativas"} - tabelas
          assert not faltando, f"tabelas faltando no Postgres: {faltando}"
          print(f"OK -- PostgreSQL no head {head} com {len(tabelas)} tabelas")
          PY

  test-web:
    name: Testes web (Vitest + cobertura)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar workspaces
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Vitest com cobertura
        run: npm run test:cov --workspace @constela/web
      - name: Publicar cobertura (artefato)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-web
          path: apps/web/coverage
          retention-days: 7
      - name: Codecov (opcional)
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          directory: apps/web/coverage
          flags: web
          token: ${{ secrets.CODECOV_TOKEN }}

  test-mobile:
    name: Testes mobile (Vitest — cifra, fila offline, retry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar workspaces
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: "Vitest (lógica pura: cifra AES, fila offline, política de retry)"
        run: npm run test --workspace @constela/mobile

  build:
    name: Build (web + quest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar workspaces
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Build do web
        run: npm run build --workspace @constela/web
      - name: Build do quest
        run: npm run build --workspace @constela/quest

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependências do backend
        run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar workspaces
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Rodar E2E (sobe backend + frontend e testa no navegador)
        run: npm run e2e --workspace @constela/web
        env:
          CI: "true"
      - name: Publicar relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Imagens Docker (validação de build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem do backend
        run: docker build -t sgpe-backend ./backend
      - name: Build da imagem do web
        run: docker build -t sgpe-web -f apps/web/Dockerfile .

  ensaio-restauracao:
    name: Ensaio de restauração (dump sintético)
    runs-on: ubuntu-latest
    # Exercita os MESMOS scripts do backup de produção (backup_postgres.sh,
    # contar_tabelas.sh, verificar_restauracao.sh) com um banco SINTÉTICO:
    # migra um PostgreSQL vazio, gera o backup cifrado com uma senha de ensaio
    # (não é segredo), restaura num segundo banco e confere versão e contagens.
    # As credenciais só existem dentro do contêiner de serviço deste job.
    services:
      postgres:
        image: postgres:16   # mesma major do psql/pg_dump que o runner já traz
        env:
          POSTGRES_USER: constela_teste
          POSTGRES_PASSWORD: constela_teste
          POSTGRES_DB: origem_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U constela_teste"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ORIGEM_URL: postgresql://constela_teste:constela_teste@localhost:5432/origem_teste
      DESTINO_URL: postgresql://constela_teste:constela_teste@localhost:5432/restauracao_teste
      BACKUP_PASSPHRASE: ensaio-ci-nao-e-segredo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependências (+ driver do Postgres)
        run: pip install -r backend/requirements.txt "psycopg[binary]==3.2.3"
      - name: Migrar a origem sintética
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://constela_teste:constela_teste@localhost:5432/origem_teste
          ENV: dev
        run: python -m scripts.migrate
      - name: Dados sintéticos e uma política de RLS (como as do Supabase)
        run: |
          psql "$ORIGEM_URL" -X -v ON_ERROR_STOP=1 \
            -c "INSERT INTO escolas (nome, ano_letivo_ativo, status, created_at) VALUES ('ESCOLA SINTETICA', 2026, 'ativa', now())" \
            -c "CREATE ROLE anon NOLOGIN" \
            -c "ALTER TABLE escolas ENABLE ROW LEVEL SECURITY" \
            -c "CREATE POLICY leitura_ensaio ON escolas FOR SELECT TO anon USING (true)"
      - name: Contar a origem, gerar o backup cifrado e restaurar
        run: |
          bash backend/scripts/contar_tabelas.sh "$ORIGEM_URL" > contagens_origem.txt
          DATABASE_URL="$ORIGEM_URL" bash backend/scripts/backup_postgres.sh ./backups
          psql "$ORIGEM_URL" -X -v ON_ERROR_STOP=1 -c "CREATE DATABASE restauracao_teste"
          RESTORE_DATABASE_URL="$DESTINO_URL" CONTAGENS_ORIGEM=contagens_origem.txt \
            bash backend/scripts/verificar_restauracao.sh backups/*.enc
      - name: As travas recusam destino real e senha errada
        run: |
          set +e
          RESTORE_DATABASE_URL="$ORIGEM_URL" bash backend/scripts/verificar_restauracao.sh backups/*.enc
          rc=$?; [ "$rc" -eq 2 ] || { echo "destino não vazio deveria sair 2 (saiu $rc)"; exit 1; }
          RESTORE_DATABASE_URL="postgresql://u:s@db.exemplo.com:5432/restauracao_teste" \
            bash backend/scripts/verificar_restauracao.sh backups/*.enc
          rc=$?; [ "$rc" -eq 2 ] || { echo "destino remoto deveria sair 2 (saiu $rc)"; exit 1; }
          psql "$ORIGEM_URL" -X -v ON_ERROR_STOP=1 -c "CREATE DATABASE restauracao_teste_senha"
          BACKUP_PASSPHRASE=senha-errada \
            RESTORE_DATABASE_URL="postgresql://constela_teste:constela_teste@localhost:5432/restauracao_teste_senha" \
            bash backend/scripts/verificar_restauracao.sh backups/*.enc
          rc=$?; [ "$rc" -ne 0 ] || { echo "senha errada deveria falhar"; exit 1; }
          echo "travas OK"
