# CI do SGPE: roda em todo push/PR.
# Backend: pytest. Clientes: typecheck do core/mobile e build do web.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependências
        run: pip install -r backend/requirements.txt
      - name: Testes
        run: python -m pytest backend/tests -q

  clientes:
    name: Web + Core + Mobile (build/typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar workspaces
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Typecheck do core
        run: npm run typecheck --workspace @constela/core
      - name: Typecheck do quest-core
        run: npm run typecheck --workspace @constela/quest-core
      - name: Build do web
        run: npm run build --workspace @constela/web
      - name: Build do quest
        run: npm run build --workspace @constela/quest
      - name: Typecheck do mobile
        run: npm run typecheck --workspace @constela/mobile

  web-unit:
    name: Web (testes unitários Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar workspaces
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Testes de UI (Vitest)
        run: npm run test --workspace @constela/web

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependências do backend
        run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar workspaces
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Rodar E2E (sobe backend + frontend e testa no navegador)
        run: npm run e2e --workspace @constela/web
        env:
          CI: "true"
      - name: Publicar relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Imagens Docker (validação)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem do backend
        run: docker build -t sgpe-backend ./backend
      - name: Build da imagem do web
        run: docker build -t sgpe-web -f apps/web/Dockerfile .
