# CI do SGPE: roda em todo push/PR.
# Backend: pytest. Clientes: typecheck do core/mobile e build do web.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependências
        run: pip install -r backend/requirements.txt
      - name: Testes
        run: python -m pytest backend/tests -q

  clientes:
    name: Web + Core + Mobile (build/typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar workspaces
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Typecheck do core
        run: npm run typecheck --workspace @sgpe/core
      - name: Build do web
        run: npm run build --workspace @sgpe/web
      - name: Typecheck do mobile
        run: npm run typecheck --workspace @sgpe/mobile

  docker:
    name: Imagens Docker (validação)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem do backend
        run: docker build -t sgpe-backend ./backend
      - name: Build da imagem do web
        run: docker build -t sgpe-web -f apps/web/Dockerfile .
